## Cross-platform smoke test for the released INLA bundles: fit a
## Germany4-style model (besag per disease, then a treepcor cgeneric
## kronecker generic0 joint model) through the released inla binary with
## the sTiles backend, on real macOS and Windows runners. The graph and
## data are synthetic, so no data files are involved; the script asserts
## finite marginal likelihoods and prints GERMANY4 SMOKE OK on success.
##
## Manual-only: this exercises a published hrue/r-inla release, not this
## repo's artifacts, so it runs on dispatch (Actions tab), never on push.
name: germany4-smoke

on:
  workflow_dispatch:
    inputs:
      inla_tag:
        description: 'hrue/r-inla release tag holding the bundles'
        required: false
        default: 'v26.08.27'

jobs:
  smoke:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            asset: inla-macos-arm64-portable.tar.gz
            call: bundle/bin/inla.run
          - os: windows-latest
            asset: inla-windows-x86_64.zip
            call: bundle/inla.exe
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Install R packages (INLA + graphpcor)
        run: |
          Rscript -e '
            repos <- c(inla = "https://inla.r-inla-download.org/R/testing",
                       cran = "https://cloud.r-project.org")
            install.packages("graphpcor", repos = repos)
            ok <- tryCatch({ install.packages("INLA", repos = repos); TRUE },
                           error = function(e) FALSE)
            if (!requireNamespace("INLA", quietly = TRUE))
                install.packages("INLA", repos = repos, type = "source")
            cat("INLA", as.character(packageVersion("INLA")), "\n")
            cat("graphpcor", as.character(packageVersion("graphpcor")), "\n")'

      - name: Fetch the released bundle
        run: |
          TAG="${{ github.event.inputs.inla_tag || 'v26.08.27' }}"
          curl -fL --retry 3 -o asset \
            "https://github.com/hrue/r-inla/releases/download/$TAG/${{ matrix.asset }}"
          mkdir -p bundle
          case "${{ matrix.asset }}" in
            *.tar.gz) tar -xzf asset -C bundle --strip-components=0 ;;
            *.zip)    (cd bundle && unzip -q ../asset) ;;
          esac
          ## macOS tarballs unpack as bin/ lib/ at top level already
          ls bundle | head
          grep -E "^(compiler|libstiles)" bundle/BUILDINFO || true

      - name: Run the Germany4 smoke test
        env:
          INLA_CALL: ${{ github.workspace }}/${{ matrix.call }}
        run: Rscript tests/germany4-smoke.R
