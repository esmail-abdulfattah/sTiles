name: bindings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["R/**", "python/**", "julia/**", ".github/workflows/bindings.yml"]

jobs:
  r:
    name: R ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/sTiles
          extra-packages: any::testthat
      - name: install package
        run: R CMD INSTALL R/sTiles
      - name: two objects + small sparse
        run: Rscript .github/ci/two_objects.R
      - name: same, KMP_DUPLICATE_LIB_OK=TRUE
        if: always() && runner.os == 'macOS'
        env:
          KMP_DUPLICATE_LIB_OK: "TRUE"
        run: Rscript .github/ci/two_objects.R
      - name: testthat
        if: always()
        shell: Rscript {0}
        run: |
          library(testthat)
          r <- as.data.frame(test_dir("R/sTiles/tests/testthat", package = "sTiles",
                                      load_package = "installed", reporter = "summary",
                                      stop_on_failure = FALSE))
          if (sum(r$failed) + sum(r$error) > 0) quit(status = 1)

  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install package
        run: python -m pip install ./python scipy pytest
      - name: two objects + small sparse
        shell: python
        run: |
          import numpy as np, scipy.sparse as sp, sTiles
          g = lambda n: sp.diags([-np.ones(n-1), 4*np.ones(n), -np.ones(n-1)], [-1, 0, 1], format="csc")
          ld = lambda Q: np.linalg.slogdet(Q.toarray())[1]
          Q1, Q2 = g(2000), 2 * g(500)
          s = sTiles.sTiles(Q1, cores=2)
          ss = sTiles.sTiles(Q2, cores=2, inverse=True)
          assert abs(s.logdet - ld(Q1)) < 1e-8 and abs(ss.logdet - ld(Q2)) < 1e-8
          s.close()
          assert np.allclose(ss.selinv_diag(), np.diag(np.linalg.inv(Q2.toarray())), rtol=1e-10)
          sss = sTiles.sTiles(Q1, cores=2)
          assert abs(sss.logdet - ld(Q1)) < 1e-8 and abs(ss.logdet - ld(Q2)) < 1e-8
          ss.close(); sss.close()
          Q3 = g(20)
          s3 = sTiles.sTiles(Q3, mode="sparse")
          assert abs(s3.logdet - ld(Q3)) < 1e-10
          assert np.allclose(Q3 @ s3.solve(np.ones(20)), 1.0)
          s3.close()
          print("OK")
      - name: pytest
        if: always()
        run: python -m pytest -q python/tests

  julia:
    name: Julia ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Pkg.test
        run: julia -e 'using Pkg; Pkg.develop(path="julia"); Pkg.test("sTiles")'
