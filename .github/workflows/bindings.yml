name: bindings

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["R/**", "python/**", "julia/**", ".github/**"]

env:
  GH_TOKEN: ${{ github.token }}

jobs:
  r:
    name: R ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/solver-env
      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: R/sTiles
          extra-packages: any::testthat
      - name: install package
        shell: bash
        run: R CMD INSTALL R/sTiles
      - name: two objects + small sparse
        shell: bash
        run: Rscript .github/ci/two_objects.R
      - name: testthat
        if: always()
        shell: Rscript {0}
        run: |
          library(testthat)
          r <- as.data.frame(test_dir("R/sTiles/tests/testthat", package = "sTiles",
                                      load_package = "installed", reporter = "summary",
                                      stop_on_failure = FALSE))
          if (sum(r$failed) + sum(r$error) > 0) quit(status = 1)

  python:
    name: Python ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/solver-env
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: install package
        run: python -m pip install ./python scipy pytest
      - name: two objects + small sparse
        run: python .github/ci/two_objects.py
      - name: pytest
        if: always()
        run: python -m pytest -q python/tests

  julia:
    name: Julia ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm, macos-latest, macos-15-intel, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/solver-env
      - uses: julia-actions/setup-julia@v2
        with:
          version: "1.11"
      - name: Pkg.test
        run: julia -e 'using Pkg; Pkg.develop(path="julia"); Pkg.test("sTiles")'
